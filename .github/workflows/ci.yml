name: Plugin source verification
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '25.0.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:unit
      - run: node scripts/verify-docs.mjs
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-package
          path: output/
          if-no-files-found: ignore
          retention-days: 14
